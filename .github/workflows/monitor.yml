name: Spojoy Pitcher Monitor

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 크롤링 도구 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 urllib3

      - name: 스크립트 실행
        run: python 스포조이.py
